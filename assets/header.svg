<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font: 700 42px 'Segoe UI', Verdana, sans-serif;
      fill: #ffffff;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .cycle-text {
      font: 500 20px 'Segoe UI', Verdana, sans-serif;
      fill: #e0e7ff;
      opacity: 0;
    }
    .l1 { animation: cycle 9s ease-in-out infinite; }
    .l2 { animation: cycle 9s ease-in-out infinite; animation-delay: 3s; }
    .l3 { animation: cycle 9s ease-in-out infinite; animation-delay: 6s; }
    @keyframes cycle {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      28%  { opacity: 1; }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .wave-a { animation: waveMove 8s linear infinite; }
    .wave-b { animation: waveMove 12s linear infinite reverse; }
    @keyframes waveMove {
      from { transform: translateX(0); }
      to   { transform: translateX(-300px); }
    }
  </style>

  <rect width="900" height="200" rx="24" fill="url(#bg)"/>

  <g class="wave-a" opacity="0.15">
    <path d="M0,175 Q75,155 150,175 T300,175 T450,175 T600,175 T750,175 T900,175 T1050,175 T1200,175 V220 H0 Z" fill="#ffffff"/>
  </g>
  <g class="wave-b" opacity="0.10">
    <path d="M0,185 Q75,165 150,185 T300,185 T450,185 T600,185 T750,185 T900,185 T1050,185 T1200,185 V220 H0 Z" fill="#ffffff"/>
  </g>

  <text x="450" y="85" text-anchor="middle" class="title">Hi, I'm Saeed 👋</text>

  <text x="450" y="125" text-anchor="middle" class="cycle-text l1">SEO Specialist &amp; Full-Stack Developer</text>
  <text x="450" y="125" text-anchor="middle" class="cycle-text l2">Building with Next.js, React &amp; Python</text>
  <text x="450" y="125" text-anchor="middle" class="cycle-text l3">Always learning, always shipping</text>
</svg>
